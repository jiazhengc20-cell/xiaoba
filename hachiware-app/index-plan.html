<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小八复习工作台</title><style>body{margin:0;background:#c8eafa;font-family:Arial,"Microsoft YaHei";color:#315367}.app{max-width:480px;margin:auto;min-height:100vh;background:#f7fcff;padding:18px 15px 90px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-weight:bold;font-size:22px;color:#4383a2}.sub{font-size:12px;color:#78a0b2}.avatar{width:60px;height:60px;object-fit:cover;border-radius:20px}.hero,.card{background:#fff;border-radius:22px;padding:16px;margin-top:15px;box-shadow:0 5px 15px #75b9d522}.hero{background:#b9e4fa;display:flex;justify-content:space-between;align-items:center}.hero img{width:140px;height:125px;object-fit:contain}.bubble{background:#fff;border-radius:16px;padding:11px;font-size:14px}.page{display:none}.page.on{display:block}h2{font-size:16px;color:#4b89a6;margin:0 0 12px}.task{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed #d5edf7}.task span:nth-child(2){flex:1;font-size:13px}.task.done span:nth-child(2){text-decoration:line-through;color:#9ab2bd}.check{width:24px;height:24px;border:2px solid #8dc6df;border-radius:8px;background:white;color:white}.done .check{background:#7ec39d}.tag{font-size:10px;background:#e5f5fc;padding:4px 7px;border-radius:9px}.bar{height:10px;background:#e8f5fa;border-radius:9px;margin-top:12px}.bar i{display:block;height:100%;background:#f2b5c4;border-radius:9px;width:0}.stats{display:flex;gap:7px;margin-top:12px}.stat{flex:1;text-align:center;background:#eef9fd;border-radius:12px;padding:8px}.stat b{display:block;color:#4d8dab;font-size:18px}.stat small{color:#83a7b5;font-size:10px}.btn{border:0;background:#5a9ab8;color:#fff;border-radius:10px;padding:10px 12px;font-weight:bold}.alt{background:#e9f7fc;color:#508ca8}.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.clock{font-size:34px;color:#4a8baa;font-weight:bold;min-width:125px}.modes{display:flex;gap:5px;margin:10px 0}.modes button{flex:1;border:1px solid #d5edf7;background:white;border-radius:9px;padding:8px;color:#568ba2}.custom{display:none;gap:6px;margin:10px 0}.custom.show{display:flex}.custom input,.note input{flex:1;border:1px solid #d5edf7;border-radius:10px;padding:10px}.note{display:flex;gap:6px;margin-top:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar span{text-align:center;padding:7px 0;border-radius:8px;background:#f4fbfd;font-size:11px}.calendar .partial{background:#bde5f7}.calendar .full{background:#f1b4c4;color:#fff;font-weight:bold}.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(450px,calc(100% - 28px));display:flex;justify-content:space-around;background:#ffffffeF;border-radius:20px;padding:10px;box-shadow:0 5px 18px #548da533}.nav button{border:0;background:none;color:#78a4b6}.nav .active{color:#4384a1}.nav small{display:block}.modal{display:none;position:fixed;inset:0;background:#31536799;align-items:center;justify-content:center}.modal.on{display:flex}.modal>div{background:#fff;border-radius:24px;text-align:center;padding:20px;margin:20px}.modal img{width:180px;height:180px;object-fit:contain}</style><body><main class="app"><header class="top"><div><div class="title">小八陪你复习</div><div class="sub" id="date"></div></div><img class="avatar" src="hachiware-assets/portrait.png"></header><section id="home" class="page on"><div class="hero"><div class="bubble" id="say"></div><img id="hero" src="hachiware-assets/portrait.png"></div><div class="card"><h2 id="dayTitle">今日任务 <span id="percent"></span></h2><div id="tasks"></div><div class="bar"><i id="fill"></i></div><div class="stats"><div class="stat"><b id="mathDone">0</b><small>数学完成</small></div><div class="stat"><b id="proDone">0</b><small>专业课完成</small></div><div class="stat"><b id="streak">0</b><small>连续打卡</small></div></div></div></section><section id="timerPage" class="page"><div class="card"><h2>专注计时</h2><div class="modes"><button onclick="setMode(15)">15</button><button onclick="setMode(25)">25</button><button onclick="setMode(50)">50</button><button onclick="customShow()">自定义</button></div><div id="custom" class="custom"><input id="mins" type="number" min="1" placeholder="分钟"><button class="btn alt" onclick="customApply()">确定</button></div><div class="timer"><span id="clock" class="clock">25:00</span><button id="start" class="btn">开始</button><button id="reset" class="btn alt">重置</button></div><div class="note"><input id="memo" placeholder="学习备注"><button class="btn alt" onclick="saveMemo()">保存</button></div></div></section><section id="checkPage" class="page"><div class="card"><h2>打卡日历</h2><div id="calendar" class="calendar"></div><p>粉色星星 = 当天全部数学任务完成。</p></div></section><section id="recordPage" class="page"><div class="card"><h2>学习记录</h2><div id="memos"></div></div></section><nav class="nav"><button class="active" onclick="go('home',this)">⌂<small>今日</small></button><button onclick="go('timerPage',this)">◷<small>计时</small></button><button onclick="go('checkPage',this)">✓<small>打卡</small></button><button onclick="go('recordPage',this)">☁<small>记录</small></button></nav></main><div id="modal" class="modal"><div><img id="modalImg" src="hachiware-assets/celebrate.png"><h2>わァ…数学全部完成啦！</h2><button class="btn" onclick="modal.classList.remove('on')">收到</button></div></div><audio id="voice" src="hachiware-voice.aac"></audio><script>
const imgs=['portrait.png','thinking.png','study2.jpg','noodle.png','cheer.png','pompon.png','sparkle.png','celebrate.png'],weekday=['周日','周一','周二','周三','周四','周五','周六'];let d=new Date(),w=d.getDay();const common=[['前一天错题与公式回顾','数学'],['当天数学真题/专题训练','数学'],['订正错题并记录错误原因','数学'],['432统计学理论与概念','专业课'],['专业课习题与背诵','专业课']];const plans={1:[['高数：极限、导数、中值定理','数学'],['高数：一元积分','数学']],2:[['线代：行列式、矩阵、秩','数学'],['线代：线性方程组与线性相关性','数学']],3:[['概率：随机变量与分布','数学'],['概率：数字特征与二维随机变量','数学']],4:[['高数综合：多元函数与重积分','数学'],['高数综合：无穷级数与微分方程','数学']],5:[['线代：特征值、特征向量、二次型','数学'],['概率：数理统计与综合小题','数学']],6:[['数学三历年真题/模拟整套','数学'],['整套真题订正与错误归因','数学']],0:[['休息日：20分钟公式回顾','数学'],['休息日：20分钟错题浏览','数学']]};let items=[...common,...plans[w]],mathCount=items.filter(x=>x[1]==='数学').length;let db=JSON.parse(localStorage.hachiPlan||'{}');db.days=db.days||{};db.memos=db.memos||[];let today=db.days[d.toISOString().slice(0,10)]||{done:[],full:false},minutes=25,left=1500,timer=null;date.textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})+' · '+weekday[w];dayTitle.firstChild.textContent=weekday[w]+'任务 ';say.innerHTML=w===0?'今天是休息日，做轻量复盘就好。':'今天的计划已经按规划安排好啦！<br>'+weekday[w]+'重点开始';function key(){return d.toISOString().slice(0,10)}function mathFull(){return items.map((x,i)=>x[1]==='数学'?i:-1).filter(i=>i>=0).every(i=>today.done.includes(i))}function save(){today.full=mathFull();db.days[key()]=today;localStorage.hachiPlan=JSON.stringify(db)}function render(){tasks.innerHTML=items.map((x,i)=>`<div class="task ${today.done.includes(i)?'done':''}"><button class="check" onclick="toggle(${i})">${today.done.includes(i)?'✓':''}</button><span>${x[0]}</span><em class="tag">${x[1]}</em></div>`).join('');let m=items.filter(x=>x[1]==='数学').length,md=items.filter((x,i)=>x[1]==='数学'&&today.done.includes(i)).length,p=today.done.length;percent.textContent=Math.round(p/items.length*100)+'%';fill.style.width=Math.round(p/items.length*100)+'%';mathDone.textContent=md+'/'+m;proDone.textContent=(p-md)+'/'+(items.length-m);streak.textContent=Object.values(db.days).filter(x=>x.full).length;hero.src='hachiware-assets/'+imgs[Math.min(today.done.length,imgs.length-1)];calendarRender();memos.innerHTML=db.memos.length?db.memos.slice().reverse().map(x=>'<p>· '+x+'</p>').join(''):'还没有学习备注。'}function toggle(i){let old=today.full;today.done=today.done.includes(i)?today.done.filter(x=>x!==i):[...today.done,i];save();render();if(today.full&&!old){voice.play().catch(()=>{});modal.classList.add('on')}}function calendarRender(){let n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();calendar.innerHTML=Array.from({length:n},(_,i)=>{let k=new Date(d.getFullYear(),d.getMonth(),i+1).toISOString().slice(0,10),v=db.days[k];return '<span class="'+(v?.full?'full':v?.done?.length?'partial':'')+'">'+(v?.full?'★':i+1)+'</span>'}).join('')}function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='checkPage')calendarRender()}function setMode(n){minutes=n;left=n*60;clock.textContent=String(n).padStart(2,'0')+':00';custom.classList.remove('show')}function customShow(){custom.classList.add('show');mins.focus()}function customApply(){let n=Number(mins.value);if(n>0)setMode(n)}function tick(){left--;clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0){clearInterval(timer);timer=null;start.textContent='开始';voice.play().catch(()=>{});modal.classList.add('on')}}start.onclick=()=>{if(timer)return;timer=setInterval(tick,1000);start.textContent='学习中'};reset.onclick=()=>{clearInterval(timer);timer=null;left=minutes*60;clock.textContent=String(minutes).padStart(2,'0')+':00';start.textContent='开始'};function saveMemo(){let x=memo.value.trim();if(x){db.memos.push(x);memo.value='';localStorage.hachiPlan=JSON.stringify(db);render()}}render();</script></body></html>
