<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b9e4fa"><title>小八陪你复习</title><style>
:root{--sky:#b9e4fa;--deep:#4c8aa9;--ink:#315367;--pink:#f3b3c3;--line:#d5edf7;--paper:#fffdfb}*{box-sizing:border-box}body{margin:0;background:#c7eafa;color:var(--ink);font-family:"Microsoft YaHei",sans-serif}.app{max-width:480px;min-height:100vh;margin:auto;background:linear-gradient(#d8f2ff,#fbfdff 48%);padding:18px 16px 88px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:22px;font-weight:800;color:#3c7898}.sub{font-size:12px;color:#6a9bb0;margin-top:4px}.avatar{width:62px;height:62px;object-fit:cover;border-radius:21px;border:4px solid #fff}.page{display:none}.page.active{display:block}.hero{margin-top:16px;background:#acdff7;border:2px solid #fff;border-radius:28px;padding:15px;display:flex;justify-content:space-between;align-items:center}.hero img{width:130px;height:130px;object-fit:contain}.bubble{background:#fff;border-radius:18px;padding:11px 13px;font-size:14px;line-height:1.5}.section{margin-top:16px;background:#fffdfbe8;border:1px solid #fff;border-radius:23px;padding:16px;box-shadow:0 8px 20px #65aeca1c}.section h2{font-size:16px;margin:0 0 12px;color:#477f9a}.task{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px dashed var(--line)}.task:last-child{border:0}.check{width:25px;height:25px;border:2px solid #8dc6df;border-radius:9px;background:#fff;color:#fff;font-weight:bold}.done .check{background:#7ec39d;border-color:#7ec39d}.done .taskname{text-decoration:line-through;color:#9ab2bd}.taskname{flex:1;font-size:14px}.chip{font-size:10px;background:#e5f5fc;color:#548da6;padding:4px 7px;border-radius:99px}.progress{height:11px;background:#e8f5fa;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#77bfe1,#f3b4c5);width:0;border-radius:99px;transition:.3s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#eef9fd;border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:20px;color:#4d8dab}.stat span{font-size:11px;color:#83a7b5}.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.time{font-size:34px;font-weight:800;color:#4a8baa;min-width:130px}.btn{border:0;background:#5a9ab8;color:#fff;border-radius:12px;padding:10px 12px;font-weight:bold}.btn.alt{background:#e9f7fc;color:#508ca8}.modes{display:flex;gap:6px;margin:12px 0}.modes button{flex:1;border:1px solid var(--line);background:#f5fbfe;border-radius:10px;padding:8px;color:#6794a8}.modes .on{background:#bde5f7;color:#397491}.custom{display:none;gap:7px;margin-bottom:10px}.custom.show{display:flex}.custom input,.note input{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;outline:none}.custom button{white-space:nowrap}.note{display:flex;gap:7px;margin-top:12px}.note input{flex:1}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:11px}.calendar span{padding:6px 0;border-radius:8px;background:#f5fbfd}.calendar .partial{background:#c9eaf7}.calendar .full{background:#f2b5c4;color:#fff;font-weight:bold}.calendar .today{outline:2px solid #4f96b4}.legend{font-size:11px;color:#82a5b4;margin-top:10px}.notes div{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}.chart{height:90px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line);padding:0 8px}.bar{flex:1;background:#a9dff5;border-radius:8px 8px 0 0;min-height:8px}.bar:nth-child(2n){background:#f5b6c5}.bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 28px));background:#ffffffed;border:1px solid #fff;border-radius:20px;padding:9px;display:flex;justify-content:space-around;box-shadow:0 5px 20px #548da533;z-index:3}.bottom button{border:0;background:none;color:#78a4b6;font-size:18px}.bottom button.active{color:#4384a1}.bottom small{display:block;font-size:10px;margin-top:2px}.modal{display:none;position:fixed;inset:0;background:#31536777;z-index:5;align-items:center;justify-content:center;padding:24px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:25px;padding:20px;text-align:center;max-width:330px}.modalbox img{width:180px;height:180px;object-fit:contain}.modalbox h2{color:#4d8daa;margin:5px}.modalbox p{color:#799baa}.modalbox button{border:0;border-radius:12px;background:#5a9ab8;color:#fff;padding:10px 25px}
</style></head><body><main class="app"><header class="top"><div><div class="title">小八陪你复习</div><div class="sub" id="date"></div></div><img class="avatar" src="hachiware-assets/smile.png"></header>
<section id="today" class="page active"><div class="hero"><div class="bubble" id="speech">今天也要一起努力！<br>数学开始啦</div><img id="heroImg" src="hachiware-assets/study.png"></div><section class="section"><h2>今日任务 <span id="pct">0%</span></h2><div id="tasks"></div><div class="progress"><i id="fill"></i></div><div class="stats"><div class="stat"><b id="done">0</b><span>完成任务</span></div><div class="stat"><b id="streak">0</b><span>连续打卡</span></div><div class="stat"><b id="week">0h</b><span>本周时长</span></div></div></section></section>
<section id="timerPage" class="page"><section class="section"><h2>专注计时</h2><div class="modes"><button onclick="setMode(15,this)">15 分钟</button><button class="on" onclick="setMode(25,this)">25 分钟</button><button onclick="setMode(50,this)">50 分钟</button><button onclick="showCustom()">自定义</button></div><div class="custom" id="custom"><input id="customMin" type="number" min="1" max="600" placeholder="输入分钟数"><button class="btn alt" onclick="applyCustom()">确定</button></div><div class="timer"><div class="time" id="clock">25:00</div><button class="btn" id="start">开始学习</button><button class="btn alt" id="reset">重置</button></div><div class="note"><input id="note" placeholder="记下本次复习内容"><button class="btn alt" id="save">保存</button></div></section></section>
<section id="checkPage" class="page"><section class="section"><h2>打卡日历</h2><div class="calendar" id="calendar"></div><div class="legend">蓝色：部分完成　粉色：数学任务全部完成，已打卡</div><p id="checkMsg"></p></section></section>
<section id="recordPage" class="page"><section class="section"><h2>学习备注</h2><div id="notes" class="notes"></div></section><section class="section"><h2>学习趋势</h2><div class="chart"><i class="bar" style="height:35%"></i><i class="bar" style="height:60%"></i><i class="bar" style="height:45%"></i><i class="bar" style="height:80%"></i><i class="bar" style="height:55%"></i><i class="bar" style="height:92%"></i><i class="bar" style="height:70%"></i></div></section></section>
<nav class="bottom"><button class="active" data-page="today">⌂<small>今日</small></button><button data-page="timerPage">◷<small>计时</small></button><button data-page="checkPage">✓<small>打卡</small></button><button data-page="recordPage">☁<small>记录</small></button></nav></main><div class="modal" id="modal"><div class="modalbox"><img src="hachiware-assets/celebrate.png"><h2>わァ…完成啦！</h2><p>今天的数学任务全部打卡成功！</p><button onclick="modal.classList.remove('show')">收到，小八</button></div></div>
<script>
const items=[['数学真题 / 专题训练','数学'],['订正错题并写下原因','数学'],['回顾高数、线代、概率公式','数学'],['432 统计学章节复习','专业课'],['专业课习题与背诵','专业课']];const todayKey=()=>new Date().toISOString().slice(0,10);let data=JSON.parse(localStorage.hachiwareStudy||'{}');data.days=data.days||{};data.notes=data.notes||[];data.focus=data.focus||0;let day=data.days[todayKey()]||{done:[],full:false};let mode=25,sec=1500,timer=null;date.textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});function persist(){data.days[todayKey()]=day;localStorage.hachiwareStudy=JSON.stringify(data)}function completedMath(){return day.done.includes(0)&&day.done.includes(1)&&day.done.includes(2)}function render(){tasks.innerHTML=items.map((x,i)=>`<div class="task ${day.done.includes(i)?'done':''}"><button class="check" onclick="toggle(${i})">${day.done.includes(i)?'✓':''}</button><span class="taskname">${x[0]}</span><span class="chip">${x[1]}</span></div>`).join('');let p=Math.round(day.done.length/items.length*100);pct.textContent=p+'%';fill.style.width=p+'%';done.textContent=day.done.length;week.textContent=data.focus+'h';heroImg.src=day.full?'hachiware-assets/celebrate.png':day.done.length?'hachiware-assets/trident.png':'hachiware-assets/study.png';speech.innerHTML=day.full?'わァ…全部完成！<br>今天超级棒！':'今天也要一起努力！<br>数学开始啦';renderCalendar();renderNotes();let s=Object.values(data.days).filter(x=>x.full).length;streak.textContent=s;checkMsg.textContent=day.full?'今日数学任务已完成，成功打卡！':'完成全部数学任务后，今天会自动打卡。'}function toggle(i){day.done=day.done.includes(i)?day.done.filter(x=>x!==i):[...day.done,i];let was=day.full;day.full=completedMath();persist();render();if(day.full&&!was){playTone();modal.classList.add('show')}}function renderCalendar(){let d=new Date(),n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();calendar.innerHTML=Array.from({length:n},(_,i)=>{let k=new Date(d.getFullYear(),d.getMonth(),i+1).toISOString().slice(0,10),v=data.days[k];return `<span class="${v?.full?'full':v?.done?.length?'partial':''} ${i+1===d.getDate()?'today':''}">${v?.full?'★':i+1}</span>`}).join('')}function renderNotes(){notes.innerHTML=data.notes.length?data.notes.slice().reverse().map(x=>`<div>· ${x}</div>`).join(''):'暂无备注，完成一次专注后记下收获吧。'}function setMode(n,b){mode=n;sec=n*60;clock.textContent=String(n).padStart(2,'0')+':00';document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');custom.classList.remove('show')}function showCustom(){custom.classList.add('show');customMin.focus()}function applyCustom(){let n=Number(customMin.value);if(!n||n<1){customMin.focus();return}mode=n;sec=n*60;clock.textContent=String(n).padStart(2,'0')+':00';custom.classList.remove('show');document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('on'))}function playTone(){let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.35)}function tick(){sec--;clock.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec<=0){clearInterval(timer);timer=null;data.focus++;persist();render();playTone();modal.classList.add('show')}}start.onclick=()=>{if(timer)return;timer=setInterval(tick,1000);start.textContent='学习中…';heroImg.src='hachiware-assets/study2.jpg'};reset.onclick=()=>{clearInterval(timer);timer=null;sec=mode*60;clock.textContent=String(mode).padStart(2,'0')+':00';start.textContent='开始学习'};save.onclick=()=>{let n=note.value.trim();if(n){data.notes.push(n);note.value='';persist();renderNotes()}};document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(b.dataset.page).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.page==='checkPage')renderCalendar();if(b.dataset.page==='recordPage')renderNotes()});render();
</script></body></html>
