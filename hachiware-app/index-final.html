<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小八复习工作台</title><style>body{margin:0;background:#c8eafa;font-family:Arial,"Microsoft YaHei";color:#315367}.app{max-width:480px;margin:auto;min-height:100vh;background:#f7fcff;padding:18px 15px 90px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-weight:bold;font-size:22px;color:#4383a2}.avatar{width:60px;height:60px;object-fit:cover;border-radius:20px}.hero,.card{background:#fff;border-radius:22px;padding:16px;margin-top:15px;box-shadow:0 5px 15px #75b9d522}.hero{background:#b9e4fa;display:flex;justify-content:space-between;align-items:center}.hero img{width:130px;height:120px;object-fit:contain}.bubble{background:#fff;border-radius:16px;padding:11px;font-size:14px}.page{display:none}.page.on{display:block}h2{font-size:16px;color:#4b89a6;margin:0 0 12px}.task{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed #d5edf7}.task span:nth-child(2){flex:1;font-size:14px}.task.done span:nth-child(2){text-decoration:line-through;color:#9ab2bd}.check{width:24px;height:24px;border:2px solid #8dc6df;border-radius:8px;background:white;color:white}.done .check{background:#7ec39d}.tag{font-size:10px;background:#e5f5fc;padding:4px 7px;border-radius:9px}.bar{height:10px;background:#e8f5fa;border-radius:9px;margin-top:12px}.bar i{display:block;height:100%;background:#f2b5c4;border-radius:9px;width:0}.stats{display:flex;gap:7px;margin-top:12px}.stat{flex:1;text-align:center;background:#eef9fd;border-radius:12px;padding:8px}.stat b{display:block;color:#4d8dab;font-size:19px}.stat small{color:#83a7b5}.btn{border:0;background:#5a9ab8;color:#fff;border-radius:10px;padding:10px 12px;font-weight:bold}.alt{background:#e9f7fc;color:#508ca8}.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.clock{font-size:34px;color:#4a8baa;font-weight:bold;min-width:125px}.modes{display:flex;gap:5px;margin:10px 0}.modes button{flex:1;border:1px solid #d5edf7;background:white;border-radius:9px;padding:8px;color:#568ba2}.custom{display:none;gap:6px;margin:10px 0}.custom.show{display:flex}.custom input,.note input{flex:1;border:1px solid #d5edf7;border-radius:10px;padding:10px}.note{display:flex;gap:6px;margin-top:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar span{text-align:center;padding:7px 0;border-radius:8px;background:#f4fbfd;font-size:11px}.calendar .partial{background:#bde5f7}.calendar .full{background:#f1b4c4;color:white;font-weight:bold}.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(450px,calc(100% - 28px));display:flex;justify-content:space-around;background:#ffffffeF;border-radius:20px;padding:10px;box-shadow:0 5px 18px #548da533}.nav button{border:0;background:none;color:#78a4b6}.nav .active{color:#4384a1}.nav small{display:block}.modal{display:none;position:fixed;inset:0;background:#31536799;align-items:center;justify-content:center}.modal.on{display:flex}.modal>div{background:#fff;border-radius:24px;text-align:center;padding:20px;margin:20px}.modal img{width:180px;height:180px;object-fit:contain}</style><body><main class="app"><header class="top"><div><div class="title">小八陪你复习</div><small id="date"></small></div><img class="avatar" src="hachiware-assets/smile.png"></header><section id="home" class="page on"><div class="hero"><div class="bubble" id="say">今天也要一起努力！<br>数学开始啦</div><img id="hero" src="hachiware-assets/study.png"></div><div class="card"><h2>今日任务 <span id="percent"></span></h2><div id="tasks"></div><div class="bar"><i id="fill"></i></div><div class="stats"><div class="stat"><b id="mathDone">0</b><small>数学完成</small></div><div class="stat"><b id="proDone">0</b><small>专业课完成</small></div><div class="stat"><b id="streak">0</b><small>连续打卡</small></div></div></div></section><section id="timerPage" class="page"><div class="card"><h2>专注计时</h2><div class="modes"><button onclick="mode(15)">15</button><button onclick="mode(25)">25</button><button onclick="mode(50)">50</button><button onclick="customShow()">自定义</button></div><div id="custom" class="custom"><input id="mins" type="number" min="1" placeholder="分钟"><button class="btn alt" onclick="customApply()">确定</button></div><div class="timer"><span id="clock" class="clock">25:00</span><button id="start" class="btn">开始</button><button id="reset" class="btn alt">重置</button></div><div class="note"><input id="memo" placeholder="学习备注"><button class="btn alt" onclick="saveMemo()">保存</button></div></div></section><section id="checkPage" class="page"><div class="card"><h2>打卡日历</h2><div id="calendar" class="calendar"></div><p>粉色星星 = 全部数学任务完成；蓝色 = 部分完成。</p></div></section><section id="recordPage" class="page"><div class="card"><h2>学习记录</h2><div id="memos"></div></div></section><nav class="nav"><button class="active" onclick="go('home',this)">⌂<small>今日</small></button><button onclick="go('timerPage',this)">◷<small>计时</small></button><button onclick="go('checkPage',this)">✓<small>打卡</small></button><button onclick="go('recordPage',this)">☁<small>记录</small></button></nav></main><div id="modal" class="modal"><div><img src="hachiware-assets/celebrate.png"><h2>わァ…数学全部完成啦！</h2><button class="btn" onclick="modal.classList.remove('on')">收到</button></div></div><audio id="voice" src="hachiware-voice.aac" preload="auto"></audio><script>
const math=[['公式与前一天错题回顾','数学'],['当天数学真题/专题训练','数学'],['订正错题并记录错误原因','数学'],['高数、线代、概率混合抽查','数学'],['晚间数学薄弱专题复盘','数学']],pro=[['432统计学理论与概念','专业课'],['专业课习题与背诵','专业课']],all=[...math,...pro],key=()=>new Date().toISOString().slice(0,10);let db=JSON.parse(localStorage.hachiFinal||'{}');db.days=db.days||{};db.memos=db.memos||[];let today=db.days[key()]||{done:[],full:false},minutes=25,left=1500,timer=null;date.textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});function mathFull(){return math.every((_,i)=>today.done.includes(i))}function persist(){today.full=mathFull();db.days[key()]=today;localStorage.hachiFinal=JSON.stringify(db)}function render(){tasks.innerHTML=all.map((x,i)=>`<div class="task ${today.done.includes(i)?'done':''}"><button class="check" onclick="toggle(${i})">${today.done.includes(i)?'✓':''}</button><span>${x[0]}</span><em class="tag">${x[1]}</em></div>`).join('');let m=today.done.filter(i=>i<math.length).length,p=today.done.length;percent.textContent=Math.round(p/all.length*100)+'%';fill.style.width=Math.round(p/all.length*100)+'%';mathDone.textContent=m+'/'+math.length;proDone.textContent=(p-m)+'/'+pro.length;streak.textContent=Object.values(db.days).filter(x=>x.full).length;hero.src=today.full?'hachiware-assets/celebrate.png':m?'hachiware-assets/trident.png':'hachiware-assets/study.png';say.innerHTML=today.full?'わァ…全部完成！<br>今天超级棒！':'今天也要一起努力！<br>数学开始啦';calendarRender();memos.innerHTML=db.memos.length?db.memos.slice().reverse().map(x=>`<p>· ${x}</p>`).join(''):'还没有学习备注。'}function toggle(i){let was=today.full;today.done=today.done.includes(i)?today.done.filter(x=>x!==i):[...today.done,i];persist();render();if(today.full&&!was){voice.play().catch(()=>{});modal.classList.add('on')}}function calendarRender(){let d=new Date(),n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();calendar.innerHTML=Array.from({length:n},(_,i)=>{let k=new Date(d.getFullYear(),d.getMonth(),i+1).toISOString().slice(0,10),v=db.days[k];return `<span class="${v?.full?'full':v?.done?.length?'partial':''}">${v?.full?'★':i+1}</span>`}).join('')}function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='checkPage')calendarRender()}function mode(n){minutes=n;left=n*60;clock.textContent=String(n).padStart(2,'0')+':00';custom.classList.remove('show')}function customShow(){custom.classList.add('show');mins.focus()}function customApply(){let n=Number(mins.value);if(n>0)mode(n)}function tick(){left--;clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0){clearInterval(timer);timer=null;db.focus=(db.focus||0)+1;localStorage.hachiFinal=JSON.stringify(db);voice.play().catch(()=>{});modal.classList.add('on');start.textContent='开始'}}start.onclick=()=>{if(timer)return;timer=setInterval(tick,1000);start.textContent='学习中'};reset.onclick=()=>{clearInterval(timer);timer=null;left=minutes*60;clock.textContent=String(minutes).padStart(2,'0')+':00';start.textContent='开始'};function saveMemo(){let x=memo.value.trim();if(x){db.memos.push(x);memo.value='';localStorage.hachiFinal=JSON.stringify(db);render()}}render();</script></body></html>
